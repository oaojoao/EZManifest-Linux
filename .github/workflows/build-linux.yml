name: Build Linux AppImage

on:
  push:
    branches: [master, vibe/*]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-appimage:
    name: Build & package AppImage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Avalonia + CEF native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libice-cil libatk1.0-0 libatk-bridge2.0-0 \
            libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 \
            libxcursor1 libxi6 libxss1 libxtst6 libnss3 libnspr4 libasound2 \
            libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libpango-1.0-0 libcairo2 \
            libxkbcommon0 libxkbfile1 || true

      - name: Publish Linux app
        run: |
          chmod +x EZManifest.Linux/Packaging/publish-linux.sh
          EZManifest.Linux/Packaging/publish-linux.sh

      - name: Download linuxdeploy
        run: |
          mkdir -p EZManifest.Linux/publish/tools
          curl -sL -o EZManifest.Linux/publish/tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  EZManifest.Linux/publish/tools/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x EZManifest.Linux/publish/tools/linuxdeploy-x86_64.AppImage

      - name: Package AppImage
        run: |
          chmod +x EZManifest.Linux/Packaging/build-appimage.sh
          EZManifest.Linux/Packaging/build-appimage.sh "1.2.2"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZManifest-Linux-AppImage
          path: EZManifest.Linux/publish/out/EZManifest-*.AppImage
          if-no-files-found: error
